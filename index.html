<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4fa8">
<title>総務からのアンケート</title>
<style>
  :root {
    --primary: #1e4fa8;
    --primary-dark: #173f88;
    --text: #222;
    --muted: #555;
    --line: #8a8a8a;
    --bg: #f5f5f5;
    --footer: #ebebeb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ヘッダー */
  header {
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .icon-btn { background: none; border: 0; color: inherit; padding: 4px; cursor: pointer; display: flex; }
  .brand { font-size: 24px; letter-spacing: .5px; flex: 1; }
  .user-box { text-align: right; font-size: 14px; line-height: 1.4; min-width: 0; }
  .user-box .email { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .status { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .status .dot { width: 12px; height: 12px; border-radius: 50%; background: #6cc24a; border: 1px solid #fff; }

  /* 本体 */
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: 32px 24px 40px; }
  .screen { display: none; }
  .screen.active { display: block; }
  h1 { font-size: 17px; font-weight: 500; text-align: center; margin: 24px 0 20px; }

  .field { display: grid; grid-template-columns: 84px 1fr; align-items: end; gap: 12px; margin-bottom: 18px; }
  .field label { text-align: right; font-size: 15px; padding-bottom: 6px; }
  .field input, .field .value {
    font: inherit; font-size: 15px; color: var(--text);
    border: 0; border-bottom: 1px solid var(--line);
    background: transparent; padding: 6px 0; width: 100%; min-width: 0;
    border-radius: 0; outline: none;
  }
  .field input:focus { border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
  .field .value { word-break: break-all; }

  .actions { margin-top: 40px; display: grid; gap: 14px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: inherit; font-size: 18px; height: 56px; border-radius: 4px; cursor: pointer;
    border: 2px solid var(--primary); transition: background .15s, transform .05s;
  }
  .btn:active { transform: scale(.99); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary); }
  .btn-outline:hover { background: #eef3fc; }

  /* 完了画面 */
  .done { text-align: center; padding-top: 16px; }
  .done .check { width: 56px; height: 56px; border-radius: 50%; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .done h2 { font-size: 19px; font-weight: 600; margin: 0 0 18px; }
  .summary { background: #fff; border-radius: 6px; padding: 16px 20px; text-align: left; font-size: 14px; margin: 20px 0 24px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .summary dl { display: grid; grid-template-columns: 84px 1fr; gap: 10px 12px; margin: 0; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; word-break: break-all; }

  /* アンケート */
  .survey { background: #fff; border-radius: 14px; text-align: left; box-shadow: 0 4px 14px rgba(30,79,168,.12); overflow: hidden; }
  .survey-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #eef3fc; border-bottom: 1px solid #dce6f7; }
  .survey-head b { font-size: 14px; color: var(--primary); display: flex; align-items: center; gap: 6px; }
  .survey-head span { font-size: 12px; color: var(--muted); }
  .survey img.hero-img { width: 100%; display: block; }
  .survey .inner { padding: 14px 16px 16px; }
  .survey .q { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
  .survey .qsub { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 8px; border: 2px solid #dfe5ef; background: #fff; border-radius: 12px; padding: 10px; font: inherit; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; text-align: left; min-height: 56px; transition: border-color .15s, background .15s; }
  .opt svg { width: 28px; height: 28px; flex: 0 0 28px; color: var(--primary); }
  .opt[aria-checked="true"] { border-color: var(--primary); background: #eef3fc; }
  .opt[aria-checked="true"]::after { content: "✓"; margin-left: auto; color: var(--primary); font-weight: 900; }
  .submit { margin-top: 14px; width: 100%; }
  .submit:disabled { opacity: .4; cursor: default; }

  /* 結果 */
  .you { display: flex; align-items: center; gap: 12px; background: #eef3fc; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .you .rank { font-size: 26px; font-weight: 900; color: var(--primary); line-height: 1; text-align: center; min-width: 52px; }
  .you .rank small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .you p { margin: 0; font-size: 13px; line-height: 1.6; }
  .you p b { font-size: 15px; }
  .chart-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .chart-title b { color: var(--text); font-size: 14px; }
  .bars { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 3px 8px; font-size: 13px; position: relative; }
  .row .lbl { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row .lbl { grid-row: 1; grid-column: 1; }
  .row .val { grid-row: 1; grid-column: 2; }
  .row .track { grid-row: 2; grid-column: 1 / -1; }
  .row .lbl svg { width: 18px; height: 18px; flex: 0 0 18px; color: #6b7a94; }
  .row .track { height: 14px; background: #eef1f6; border-radius: 0 4px 4px 0; }
  .row .bar { height: 100%; width: 0; background: #9db8e6; border-radius: 0 4px 4px 0; transition: width .9s cubic-bezier(.3,1,.4,1); }
  .row.mine .bar { background: var(--primary); }
  .row.mine .lbl { font-weight: 800; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .row .val small { color: var(--muted); margin-left: 3px; }
  .row .me { font-size: 10px; font-weight: 800; color: #fff; background: var(--primary); border-radius: 999px; padding: 0 6px; }
  .row:hover .track, .row:focus-visible .track { outline: 2px solid #c7d6ef; outline-offset: 2px; }
  .tip { position: absolute; left: 24px; top: -30px; background: #1d2233; color: #fff; font-size: 12px; border-radius: 6px; padding: 3px 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 2; }
  .row:hover .tip, .row:focus-visible .tip { opacity: 1; }
  .demo-note { font-size: 11px; color: #b0571a; background: #fff4e5; border-radius: 6px; padding: 4px 8px; margin: 12px 0 0; }
  .after { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .after button { background: none; border: 0; color: var(--primary); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .thanks-line { font-size: 14px; font-weight: 700; color: var(--primary); margin: 0 0 10px; }

  /* フッター */
  footer { background: var(--footer); padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); font-size: 14px; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 0; }
  footer nav a { color: var(--primary); text-decoration: none; padding: 0 12px; border-left: 1px solid #999; }
  footer nav a:first-child { border-left: 0; padding-left: 0; }
  footer .copy { color: #888; text-align: center; margin-top: 16px; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <button class="icon-btn" aria-label="メニュー">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="brand">SEAT</div>
    <div class="user-box">
      <div class="email" id="headerUser"></div>
      <div class="status">
        <span class="dot"></span>テレワーク
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
      </div>
    </div>
  </header>

  <main>
    <!-- 入力画面 -->
    <section class="screen active" id="screen-form">
      <h1>在席退席登録</h1>
      <div class="field">
        <label for="card">カード番号</label>
        <input id="card" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label>ユーザーID</label>
        <div class="value" id="userId"></div>
      </div>
      <div class="field">
        <label for="comment">コメント</label>
        <input id="comment" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="datetime">日時</label>
        <input id="datetime" type="datetime-local">
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="btnIn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M11 7 9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-8v2h8v14z"/></svg>
          在席登録
        </button>
        <button class="btn btn-outline" id="btnOut">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m17 7-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4V5z"/></svg>
          退席登録
        </button>
      </div>
    </section>

    <!-- 完了画面 -->
    <section class="screen" id="screen-done">
      <div class="done">
        <div class="check"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
        <h2 id="doneTitle">在席登録が完了しました</h2>

        <section class="survey" aria-label="総務からのアンケート">
          <div class="survey-head">
            <b><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>総務からのアンケート</b>
            <span id="deadline"></span>
          </div>
          <div id="surveyBody"></div>
        </section>

        <div class="summary">
          <dl>
            <dt>ユーザーID</dt><dd id="sumUser"></dd>
            <dt>日時</dt><dd id="sumTime"></dd>
            <dt>コメント</dt><dd id="sumComment"></dd>
          </dl>
        </div>
        <button class="btn btn-outline" id="btnBack" style="width:100%">戻る</button>
      </div>
    </section>
  </main>

  <footer>
    <nav>
      <a href="#">利用規約</a>
      <a href="#">プライバシーポリシー</a>
      <a href="#">ウェブアクセシビリティ</a>
    </nav>
    <div class="copy">Prototype — 実際の登録は行われません</div>
  </footer>

<script>
  const USER_ID = 'taro.yamada@example.com';
  const $ = (id) => document.getElementById(id);

  $('headerUser').textContent = USER_ID;
  $('userId').textContent = USER_ID;

  function nowLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }
  $('datetime').value = nowLocal();

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }

  // ---- 総務からのアンケート ----
  const VOTE_KEY = 'survey13-vote-v1';   // このプロト専用の保存名
  const SURVEY = {
    question: 'あなたのオフィスに必要なものは？',
    sub: 'いちばん欲しいものを1つ選んでください。結果は総務で設備計画の参考にします。',
    deadline: '2026-11-13',
  };
  const ic = (d) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
  const OPTIONS = [
    { id: 'display', label: '外部ディスプレイ',   icon: ic('M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z') },
    { id: 'booth',   label: '個室の会議ブース',   icon: ic('M12 1a9 9 0 0 0-9 9v7a3 3 0 0 0 3 3h3v-8H5v-2a7 7 0 0 1 14 0v2h-4v8h3a3 3 0 0 0 3-3v-7a9 9 0 0 0-9-9z') },
    { id: 'desk',    label: '昇降デスク',         icon: ic('M2 7h20v3h-2v11h-2V10H6v11H4V10H2V7zm9-5h2v4h-2V2zm-4 1 1.4-1.4L11 4.2 9.6 5.6 7 3zm10 0-2.6 2.6L13 4.2l2.6-2.6L17 3z') },
    { id: 'focus',   label: '集中できる静かな席', icon: ic('M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm0 16a7 7 0 1 1 7-7 7 7 0 0 1-7 7zm0-11a4 4 0 1 0 4 4 4 4 0 0 0-4-4zm0 6a2 2 0 1 1 2-2 2 2 0 0 1-2 2z') },
    { id: 'cafe',    label: 'リフレッシュスペース', icon: ic('M20 3H4v10a4 4 0 0 0 4 4h6a4 4 0 0 0 4-4v-3h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 5h-2V5h2v3zM2 19h18v2H2v-2z') },
    { id: 'power',   label: '電源・充電スタンド', icon: ic('M16 7V3h-2v4h-4V3H8v4H7v6.5L10.5 17v4h3v-4L17 13.5V7h-1z') },
    { id: 'locker',  label: 'ロッカー',           icon: ic('M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h5V4H6zm7 0v16h5V4h-5zM8 10h2v4H8v-4zm6 0h2v4h-2v-4z') },
    { id: 'green',   label: '植物・グリーン',     icon: ic('M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z') },
  ];
  const optById = Object.fromEntries(OPTIONS.map(o => [o.id, o]));

  // ほかの人の回答（デモ用の集計）。本番はこの2つの関数を集計サーバーの取得・送信に差し替える
  const DEMO_COUNTS = { display: 128, booth: 112, desk: 64, focus: 58, cafe: 47, power: 39, locker: 26, green: 21 };
  function fetchResults() { return Promise.resolve({ ...DEMO_COUNTS }); }
  function submitVote(id) { try { localStorage.setItem(VOTE_KEY, id); } catch {} return Promise.resolve(); }
  function myVote() { try { return localStorage.getItem(VOTE_KEY); } catch { return null; } }
  function clearVote() { try { localStorage.removeItem(VOTE_KEY); } catch {} }

  function renderDeadline() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = Math.round((new Date(SURVEY.deadline + 'T00:00:00') - today) / 86400000);
    const md = SURVEY.deadline.slice(5).replace('-', '/').replace(/^0/, '');
    $('deadline').textContent = d >= 0 ? `回答期限 ${md}（あと${d}日）` : `回答期限 ${md}（終了）`;
  }

  let picked = null;
  function renderQuestion() {
    picked = myVote();
    $('surveyBody').innerHTML = `<img class="hero-img" src="assets/survey.svg" alt="">
      <div class="inner">
        <p class="q">${SURVEY.question}</p>
        <p class="qsub">${SURVEY.sub}</p>
        <div class="opts" role="radiogroup" aria-label="${SURVEY.question}">${OPTIONS.map(o => `<button class="opt" role="radio" data-id="${o.id}" aria-checked="${o.id === picked}">${o.icon}<span>${o.label}</span></button>`).join('')}</div>
        <button class="btn btn-primary submit" id="btnVote" ${picked ? '' : 'disabled'}>回答してみんなの結果を見る</button>
      </div>`;
    $('surveyBody').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      picked = b.dataset.id;
      $('surveyBody').querySelectorAll('.opt').forEach(x => x.setAttribute('aria-checked', x === b));
      $('btnVote').disabled = false;
    }));
    $('btnVote').addEventListener('click', async () => {
      if (!picked) return;
      await submitVote(picked);
      renderResults(true);
    });
  }

  async function renderResults(justVoted) {
    const mine = myVote();
    const counts = await fetchResults();
    if (mine) counts[mine] = (counts[mine] || 0) + 1;   // 自分の1票を足す
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    const rows = OPTIONS.map(o => ({ ...o, n: counts[o.id] || 0 })).sort((a, b) => b.n - a.n);
    const max = rows[0].n;
    const myRank = rows.findIndex(r => r.id === mine) + 1, me = rows[myRank - 1];
    const pct = (n) => Math.round(n / total * 100);
    $('surveyBody').innerHTML = `<div class="inner">
        ${justVoted ? '<p class="thanks-line">回答ありがとうございました！</p>' : ''}
        <div class="you">
          <div class="rank">${myRank}位<small>あなたの回答</small></div>
          <p><b>${me.label}</b><br>同じ回答をした人は <b>${me.n}人</b>（${pct(me.n)}%）でした。${myRank === 1 ? 'いちばん人気の回答です！' : `1位は「${rows[0].label}」です。`}</p>
        </div>
        <p class="chart-title"><b>${SURVEY.question}</b><span>回答 ${total}人</span></p>
        <div class="bars" role="list">${rows.map(r => `<div class="row ${r.id === mine ? 'mine' : ''}" role="listitem" tabindex="0" aria-label="${r.label} ${r.n}人 ${pct(r.n)}%">
            <span class="lbl">${r.icon}<span>${r.label}</span></span>
            <span class="track"><span class="bar" style="display:block" data-w="${r.n / max * 100}"></span></span>
            <span class="val">${pct(r.n)}%<small>${r.n}人</small></span>
            <span class="tip">${r.label}：${r.n}人（${pct(r.n)}%）${r.id === mine ? ' ・ あなたの回答' : ''}</span>
          </div>`).join('')}</div>
        <p class="demo-note">※ ほかの人の回答はデモ用の集計です（あなたの1票は加わっています）</p>
        <div class="after"><span>回答期限まで、回答は変更できます</span><button id="btnChange">回答を変更する</button></div>
      </div>`;
    // 「あなた」の札を付ける
    const mineRow = $('surveyBody').querySelector('.row.mine .lbl');
    if (mineRow) mineRow.insertAdjacentHTML('beforeend', '<span class="me">あなた</span>');
    requestAnimationFrame(() => $('surveyBody').querySelectorAll('.bar').forEach(b => { b.style.width = `${b.dataset.w}%`; }));
    $('btnChange').addEventListener('click', renderQuestion);   // 前の回答を選んだ状態で質問に戻る
  }

  // 在席・退席のたびに、まっさらな質問から始める
  function startSurvey() {
    renderDeadline();
    clearVote();
    renderQuestion();
  }

  function register(kind) {
    const dt = $('datetime').value || nowLocal();
    $('doneTitle').textContent = `${kind}登録が完了しました`;
    $('sumUser').textContent = USER_ID;
    $('sumTime').textContent = dt.replace('T', ' ').replace(/-/g, '/');
    $('sumComment').textContent = $('comment').value || '—';
    show('screen-done');
    startSurvey();
  }

  $('btnIn').addEventListener('click', () => register('在席'));
  $('btnOut').addEventListener('click', () => register('退席'));
  $('btnBack').addEventListener('click', () => {
    clearVote();   // 登録画面に戻ったら回答をリセット
    $('datetime').value = nowLocal();
    show('screen-form');
  });
</script>
</body>
</html>
